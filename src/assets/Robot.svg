<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- 얼굴은 계속 살아있어야 한다: 깜빡임 + 좌우 시선 + 안테나 펄스.
       이 SVG 는 <img src> 로 로드되므로 바깥 CSS 가 내부에 닿지 않는다 → 내부 애니메이션/명암은 파일 안에 둔다.
       3D 회전(perspective/rotateY)은 바깥에서 <img> 요소 자체에 건다 (ChatPanel.css .agent-chat-fab img).
       SVG 내부 요소의 preserve-3d 는 브라우저 지원이 부실해 쓰지 않는다 — 볼륨은 그라디언트 명암으로 만든다. -->
  <defs>
    <!-- 좌상단 광원: 셸은 위/왼쪽이 밝고 아래/오른쪽으로 떨어진다 -->
    <linearGradient id="shell" x1="16" y1="16" x2="50" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.55" stop-color="#EDF3FF"/>
      <stop offset="1" stop-color="#B9C6DE"/>
    </linearGradient>
    <!-- 스크린: 오목한 유리 느낌 (가장자리 밝고 중앙이 깊게) -->
    <linearGradient id="screen" x1="17" y1="21" x2="47" y2="43" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#243149"/>
      <stop offset="0.5" stop-color="#141C2C"/>
      <stop offset="1" stop-color="#0C1220"/>
    </linearGradient>
    <!-- 유리 상단 반사 하이라이트 -->
    <linearGradient id="glass" x1="17" y1="21" x2="17" y2="34" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="limb" x1="8" y1="29" x2="8" y2="41" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F7FAFF"/>
      <stop offset="1" stop-color="#B9C6DE"/>
    </linearGradient>
    <radialGradient id="eye" cx="0.35" cy="0.32" r="0.8">
      <stop offset="0" stop-color="#DCEBFF"/>
      <stop offset="0.45" stop-color="#79B4FF"/>
      <stop offset="1" stop-color="#3D7FE0"/>
    </radialGradient>
    <radialGradient id="bulb" cx="0.35" cy="0.3" r="0.85">
      <stop offset="0" stop-color="#EAF3FF"/>
      <stop offset="0.5" stop-color="#79B4FF"/>
      <stop offset="1" stop-color="#3D7FE0"/>
    </radialGradient>
  </defs>
  <style>
    .eyes { animation: robot-look 6s ease-in-out infinite; }
    .eye {
      transform-box: fill-box;
      transform-origin: center;
      animation: robot-blink 4.2s ease-in-out infinite;
    }
    .antenna {
      transform-box: fill-box;
      transform-origin: center;
      animation: robot-pulse 2s ease-in-out infinite;
    }
    @keyframes robot-blink {
      0%, 91%, 100% { transform: scaleY(1); }
      94%, 96% { transform: scaleY(0.12); }
    }
    @keyframes robot-look {
      0%, 22%, 100% { transform: translateX(0); }
      36%, 46% { transform: translateX(2.4px); }
      62%, 72% { transform: translateX(-2.4px); }
    }
    @keyframes robot-pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.45; }
    }
    @media (prefers-reduced-motion: reduce) {
      .eyes, .eye, .antenna { animation: none; }
    }
  </style>
  <path d="M13 29H8v12h5M51 29h5v12h-5" stroke="url(#limb)" stroke-width="4" stroke-linejoin="round"/>
  <path d="M32 17V10" stroke="url(#limb)" stroke-width="4" stroke-linecap="round"/>
  <rect x="13" y="17" width="38" height="34" rx="12" fill="url(#shell)"/>
  <!-- 셸 아래쪽 접지 그림자: 바닥이 어두워야 떠 있는 덩어리로 보인다 -->
  <ellipse cx="32" cy="49.5" rx="15" ry="2.2" fill="#8797B4" opacity="0.35"/>
  <rect x="17" y="21" width="30" height="22" rx="8" fill="url(#screen)"/>
  <rect x="17" y="21" width="30" height="13" rx="8" fill="url(#glass)"/>
  <g class="eyes">
    <circle class="eye" cx="26" cy="32" r="4" fill="url(#eye)"/>
    <circle class="eye" cx="38" cy="32" r="4" fill="url(#eye)"/>
  </g>
  <path d="M25 40c2.2 1.8 4.5 2.7 7 2.7s4.8-.9 7-2.7" stroke="#79B4FF" stroke-width="2.5" stroke-linecap="round"/>
  <circle class="antenna" cx="32" cy="8" r="4" fill="url(#bulb)"/>
</svg>
